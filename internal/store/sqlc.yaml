# Generowanie: docker run --rm -v "$PWD":/src -w /src/internal/store sqlc/sqlc:1.27.0 generate
# (z katalogu głównego repo). Wygenerowanego kodu w db/ nie edytujemy ręcznie.
version: "2"
sql:
  - engine: postgresql
    schema: ../../migrations
    queries: zapytania
    gen:
      go:
        package: db
        out: db
        sql_package: pgx/v5
        emit_empty_slices: true
        rename:
          uruchomienium: Uruchomienie
          plany: Plan
          zestawy_danych: ZestawDanych
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: jsonb
            go_type: encoding/json.RawMessage
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: pg_catalog.int4
            nullable: true
            go_type:
              type: int32
              pointer: true
          - db_type: pg_catalog.float8
            nullable: true
            go_type:
              type: float64
              pointer: true
          - db_type: text
            nullable: true
            go_type:
              type: string
              pointer: true
